<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dialogue system</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="header-left">
                <h1>Dialogue system</h1>
            </div>
            <button class="help-btn" id="toggle-help" title="Open help">❓</button>
        </header>

        <main class="chat-wrapper">
            <section id="chat-window" class="chat-messages" aria-live="polite">
                <div class="message system">
                    <div class="message-content">I am a virtual assistent capable of discussing any topic related to Hobby. </div>
                </div>
            </section>

            <footer class="chat-input-area">
                <textarea id="user-input" placeholder="Ask..." rows="1" aria-label="Message input"></textarea>
                <button id="send-btn" class="send-button" aria-label="Send message">➤</button>
            </footer>
        </main>

        <aside class="help-panel" id="help-panel">
            <h3>Help</h3>
            <ul>
                <li>Ask a question using bottom input field.</li>
                <li>This system is capable of answering only on questions that are related to "Hobby" topic.</li>
            </ul>
            <button class="close-help" id="close-help">Close</button>
        </aside>
    </div>
    <script src="script.js"></script>
</body>
</html>
