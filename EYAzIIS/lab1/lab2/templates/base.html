<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Corpus Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
            <div class="alert alert-{{ 'danger' if category == 'error' else 'success' }} alert-dismissible fade show">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            {% endfor %}
        {% endif %}
    {% endwith %}
    
    <nav class="mb-4">
        <a class="btn btn-outline-primary" href="{{ url_for('index') }}">Загрузка текста</a>
        <a class="btn btn-outline-info" href="{{ url_for('corpus_list') }}">Корпус текстов</a>
        <a class="btn btn-outline-success" href="{{ url_for('browse') }}">Поиск лексики</a>
        <a class="btn btn-outline-secondary" href="{{ url_for('stats') }}">Статистика</a>
        <a class="btn btn-outline-dark" href="{{ url_for('help') }}">Помощь</a>
    </nav>
    {% block content %}{% endblock %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
