{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Редактирование анализа {{ text_name }}</h2>
    <a href="{{ url_for('view', id=analysis_id) }}" class="btn btn-secondary">← Назад</a>
</div>

<div class="alert alert-warning">
    <strong>Внимание!</strong> Изменение текста приведёт к его повторному синтаксическому анализу.
    Старый файл будет заменён новым.
</div>

<form method="POST">
    <div class="mb-3">
        <label class="form-label">Название анализа *</label>
        <input type="text" name="name" class="form-control" value="{{ text_name }}" required>
    </div>
    
    <div class="mb-3">
        <label class="form-label">Содержимое текста *</label>
        <textarea name="text" class="form-control" rows="10" required>{{ current_text }}</textarea>
    </div>
    
    <div class="d-flex gap-2">
        <button type="submit" class="btn btn-success">
            <i class="bi bi-check-lg"></i> Сохранить изменения
        </button>
        <a href="{{ url_for('view', id=analysis_id) }}" class="btn btn-secondary">Отмена</a>
    </div>
</form>

{% endblock %}
