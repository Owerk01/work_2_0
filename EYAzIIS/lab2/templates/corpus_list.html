{% extends "base.html" %}
{% block content %}
<h2>Список текстов корпуса</h2>
<table class="table table-striped">
    <thead>
        <tr>
            <th>ID</th>
            <th>Название</th>
            <th>Автор</th>
            <th>Год</th>
            <th>Область</th>
            <th>Файл</th>
            <th>Действия</th>
        </tr>
    </thead>
    <tbody>
    {% for t in texts %}
        <tr>
            <td>{{ t[0] }}</td>
            <td>{{ t[1] }}</td>
            <td>{{ t[2] }}</td>
            <td>{{ t[3] }}</td>
            <td>{{ t[4] }}</td>
            <td>{{ t[5] }}</td>
            <td>
                <a href="{{ url_for('view_text', text_id=t[0]) }}" class="btn btn-sm btn-info">Текст</a>
                <a href="{{ url_for('edit_text', text_id=t[0]) }}" class="btn btn-sm btn-warning">✏️</a>
                <a href="{{ url_for('delete_text', text_id=t[0]) }}" class="btn btn-sm btn-danger" onclick="return confirm('Удалить текст и все его лексемы?')">🗑️</a>
            </td>
        </tr>
    {% endfor %}
    </tbody>
</table>
{% endblock %}
